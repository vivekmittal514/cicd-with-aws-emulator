name: CI - Test with AWS Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EMULATOR_PORT: "9297"
  TF_VERSION: "1.9.0"
  PYTHON_VERSION: "3.12"

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  emulator-tests:
    name: Integration Tests (AWS Emulator)
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Build AWS Emulator image
        run: docker build -t aws-emulator docker/aws-emulator/

      - name: Start AWS Emulator
        run: |
          mkdir -p "$HOME/.aws/emulator"
          docker run -d \
            --name aws-emulator-ci \
            --user "$(id -u):$(id -g)" \
            --memory=2g --memory-swap=2g \
            -p "127.0.0.1:${EMULATOR_PORT}:${EMULATOR_PORT}" \
            -e HOME=/home/emulator \
            -v "$HOME/.aws/emulator:/home/emulator/.aws/emulator" \
            aws-emulator -p "$EMULATOR_PORT"
          sleep 2
          echo "==> Container status:"
          docker ps -a --filter name=aws-emulator-ci --format "{{.Status}}"
          echo "==> Container logs:"
          docker logs aws-emulator-ci 2>&1 || true

      - name: Wait for emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sk "https://127.0.0.1:${EMULATOR_PORT}" >/dev/null 2>&1; then
              echo "Emulator ready"
              exit 0
            fi
            if ! docker ps -q --filter name=aws-emulator-ci | grep -q .; then
              echo "Emulator container exited unexpectedly"
              docker logs aws-emulator-ci 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          echo "Emulator failed to start within 60s"
          docker logs aws-emulator-ci 2>&1 || true
          exit 1

      - name: Configure emulator environment
        run: |
          echo "AWS_ENDPOINT_URL=https://127.0.0.1:${EMULATOR_PORT}" >> "$GITHUB_ENV"
          echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/${EMULATOR_PORT}/emulator_credentials" >> "$GITHUB_ENV"
          echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/${EMULATOR_PORT}/config" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/${EMULATOR_PORT}/ca.pem" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_DISABLE_HOST_PREFIX_INJECTION=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: Unset real AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Phase 1: API-level integration tests
      - name: "Phase 1: API integration tests"
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_post_apply.py \
            --junitxml=test-results/api-tests.xml

      # Phase 2: Terraform apply to emulator
      - name: Terraform Init (emulator)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform Plan (emulator)
        working-directory: terraform
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply (emulator)
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        working-directory: terraform
        run: terraform output

      # Phase 3: Post-apply verification tests
      - name: "Phase 3: Post-apply verification tests"
        run: |
          python -m pytest tests/test_post_apply.py -v --tb=short \
            --junitxml=test-results/post-apply-tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Stop emulator
        if: always()
        run: |
          docker stop aws-emulator-ci || true
          docker rm aws-emulator-ci || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true
          output_format: sarif
